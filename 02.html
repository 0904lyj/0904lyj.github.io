<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div悬停效果</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            background-color: red;
            margin-bottom: 20px;
        }
        .box:hover{
            border: 5px solid black;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</body>
</html>
